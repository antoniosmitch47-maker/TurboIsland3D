<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script>
(()=>{const root=document.getElementById('game'),msg=document.getElementById('message'),sub=document.getElementById('submessage'),startBtn=document.getElementById('start'),speedEl=document.getElementById('speed'),infoEl=document.getElementById('raceInfo');if(!window.THREE){msg.textContent='No se pudo cargar el motor 3D';sub.textContent='Comprueba tu conexión a Internet';startBtn.style.display='none';return}
const scene=new THREE.Scene();scene.background=new THREE.Color(0x83d5ec);scene.fog=new THREE.Fog(0x83d5ec,100,230);const camera=new THREE.PerspectiveCamera(66,innerWidth/innerHeight,.1,400);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;root.appendChild(renderer.domElement);

const mat=(c,r=.8,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});const sand=mat(0xe7cf91),grass=mat(0x4b9d4c),road=mat(0x343a40,.96),white=mat(0xf4f0df),red=mat(0xe84b3c),dark=mat(0x202a30),leaf=mat(0x168b4d),wood=mat(0x86552d),yellow=mat(0xffd65b);
const sea=new THREE.Mesh(new THREE.PlaneGeometry(600,600),mat(0x159dbb));sea.rotation.x=-Math.PI/2;sea.position.y=-.5;scene.add(sea);const island=new THREE.Mesh(new THREE.CircleGeometry(105,96),sand);island.rotation.x=-Math.PI/2;island.position.y=-.22;scene.add(island);const field=new THREE.Mesh(new THREE.CircleGeometry(86,96),grass);field.rotation.x=-Math.PI/2;field.position.y=-.18;scene.add(field);
const pts=[];for(let i=0;i<240;i++){const a=i/240*Math.PI*2;pts.push(new THREE.Vector3(Math.cos(a)*43,0,Math.sin(a)*28))}const curve=new THREE.CatmullRomCurve3(pts,true,'catmullrom',.12),roadPoints=curve.getPoints(480),positions=[],indices=[];for(let i=0;i<roadPoints.length;i++){const p=roadPoints[i],t=curve.getTangent(i/480).normalize(),side=new THREE.Vector3(-t.z,0,t.x);for(const s of [-1,1]){const v=p.clone().addScaledVector(side,s*10);positions.push(v.x,.02,v.z)}if(i<roadPoints.length-1){const k=i*2;indices.push(k,k+1,k+2,k+1,k+3,k+2)}}const rg=new THREE.BufferGeometry();rg.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));rg.setIndex(indices);rg.computeVertexNormals();const rm=new THREE.Mesh(rg,road);rm.receiveShadow=true;scene.add(rm);

function palm(x,z,s=1){const g=new THREE.Group();g.position.set(x,0,z);g.scale.setScalar(s);const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.2,.36,5.2,8),wood);trunk.position.y=2.6;trunk.rotation.z=.08;trunk.castShadow=true;g.add(trunk);for(let j=0;j<8;j++){const a=j*Math.PI/4,l=new THREE.Mesh(new THREE.ConeGeometry(.42,4.4,6),leaf);l.position.set(Math.cos(a)*1.45,4.9,Math.sin(a)*1.45);l.rotation.z=-Math.cos(a)*.8;l.rotation.x=Math.sin(a)*.8;g.add(l)}scene.add(g)}for(let i=0;i<42;i++){const a=i/42*Math.PI*2,rad=61+(i%3)*5;palm(Math.cos(a)*rad,Math.sin(a)*rad*.72,.75+(i%4)*.1)}for(let i=0;i<18;i++){const a=i*2.17,rad=76+(i%4)*4;const rock=new THREE.Mesh(new THREE.DodecahedronGeometry(1.2+(i%3)*.5),mat(0x82918a));rock.position.set(Math.cos(a)*rad,.5,Math.sin(a)*rad*.72);rock.castShadow=true;scene.add(rock)}
const stand=new THREE.Group();stand.position.set(-58,0,-3);const base=new THREE.Mesh(new THREE.BoxGeometry(13,3,7),mat(0x31516a));base.position.y=1.5;stand.add(base);for(let i=0;i<3;i++){const row=new THREE.Mesh(new THREE.BoxGeometry(13,.35,1.7),mat(i%2?0xf1c34b:0xe95b45));row.position.set(0,2.2+i*.65,-2+i*1.4);stand.add(row)}scene.add(stand);
function makeCar(color){const g=new THREE.Group(),paint=mat(color,.38,.18),glass=mat(0x17394b,.22,.25),rubber=mat(0x14191d),metal=mat(0xb9c4c8,.32,.55);const chassis=new THREE.Mesh(new THREE.BoxGeometry(2.15,.48,3.65),dark);chassis.position.y=.72;chassis.castShadow=true;g.add(chassis);const body=new THREE.Mesh(new THREE.BoxGeometry(2.12,.7,3.25),paint);body.position.y=1.02;body.castShadow=true;g.add(body);const hood=new THREE.Mesh(new THREE.BoxGeometry(1.85,.23,1.12),paint);hood.position.set(0,1.42,1.02);g.add(hood);const cabin=new THREE.Mesh(new THREE.BoxGeometry(1.55,.83,1.55),glass);cabin.position.set(0,1.58,-.12);cabin.castShadow=true;g.add(cabin);const roof=new THREE.Mesh(new THREE.BoxGeometry(1.68,.16,1.62),paint);roof.position.set(0,2.02,-.12);g.add(roof);const bumper=new THREE.Mesh(new THREE.BoxGeometry(2.28,.2,.25),dark);bumper.position.set(0,.7,1.83);g.add(bumper);for(const x of [-.72,.72]){const lamp=new THREE.Mesh(new THREE.BoxGeometry(.38,.19,.08),mat(0xfff3b0,.25));lamp.position.set(x,1.22,1.68);g.add(lamp)}for(const x of [-.83,.83]){const bar=new THREE.Mesh(new THREE.CylinderGeometry(.055,.055,1.45,8),dark);bar.position.set(x,1.67,-.15);g.add(bar)}const wheels=[];for(const x of [-1.12,1.12])for(const z of [-1.12,1.12]){const w=new THREE.Mesh(new THREE.CylinderGeometry(.43,.43,.32,18),rubber);w.rotation.z=Math.PI/2;w.position.set(x,.58,z);w.castShadow=true;g.add(w);wheels.push(w);const hub=new THREE.Mesh(new THREE.CylinderGeometry(.22,.22,.34,12),metal);hub.rotation.z=Math.PI/2;hub.position.set(x,.58,z);g.add(hub)}const spoiler=new THREE.Mesh(new THREE.BoxGeometry(1.7,.12,.38),dark);spoiler.position.set(0,1.65,-1.72);g.add(spoiler);return {group:g,wheels}}
const player=makeCar(0xe53935);scene.add(player.group);const ai=[makeCar(0x2478d5),makeCar(0xffc52f)];ai.forEach(c=>scene.add(c.group));
function pose(car,p,lane){const u=((p%1)+1)%1,q=curve.getPointAt(u),t=curve.getTangentAt(u).normalize(),side=new THREE.Vector3(-t.z,0,t.x);car.group.position.copy(q).addScaledVector(side,lane);car.group.position.y=.04;car.group.rotation.y=Math.atan2(t.x,t.z)}
const state={running:false,playerProgress:0,velocity:0,lateral:0,steer:0,lap:1,elapsed:0,aiProgress:[.012,.025],aiSpeed:[20.5,19.2]},keys={left:false,right:false,gas:false,brake:false};function bind(id,k){const el=document.getElementById(id),down=e=>{e.preventDefault();keys[k]=true},up=e=>{e.preventDefault();keys[k]=false};el.addEventListener('pointerdown',down);['pointerup','pointercancel','pointerleave'].forEach(v=>el.addEventListener(v,up))}bind('left','left');bind('right','right');bind('gas','gas');bind('brake','brake');
const trackLength=curve.getLength();function startRace(){state.running=true;state.playerProgress=0;state.velocity=0;state.lateral=0;state.steer=0;state.lap=1;state.elapsed=0;state.aiProgress=[.012,.025];pose(player,0,0);pose(ai[0],.012,-3.5);pose(ai[1],.025,3.5);startBtn.style.display='none';msg.textContent='¡A CORRER!';sub.textContent='¡SALIDA!'}startBtn.addEventListener('click',startRace);const clock=new THREE.Clock();
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04);if(state.running){state.elapsed+=dt;state.velocity+= (keys.gas?26:0)*dt;state.velocity-=(keys.brake?39:0)*dt;state.velocity-=state.velocity*dt*(keys.gas?.22:.72);state.velocity=THREE.MathUtils.clamp(state.velocity,0,36);const desired=keys.left?-1:keys.right?1:0;state.steer=THREE.MathUtils.damp(state.steer,desired,5.5,dt);
 // Corrected: left input shifts toward the left side of the road, right toward the right.
 state.lateral=THREE.MathUtils.clamp(state.lateral-state.steer*dt*(2+state.velocity*.19),-7.2,7.2);if(!desired)state.lateral=THREE.MathUtils.damp(state.lateral,0,.22,dt);const offroad=Math.abs(state.lateral)>6.1,actualSpeed=state.velocity*(offroad?.58:1);state.playerProgress+=actualSpeed*dt/trackLength;const u=state.playerProgress%1,q=curve.getPointAt(u),t=curve.getTangentAt(u).normalize(),side=new THREE.Vector3(-t.z,0,t.x);player.group.position.copy(q).addScaledVector(side,state.lateral);player.group.position.y=.04;player.group.rotation.y=Math.atan2(t.x,t.z)+state.steer*.13;player.wheels.forEach(w=>w.rotation.x+=actualSpeed*dt*1.8);
 state.aiProgress[0]+=state.aiSpeed[0]*dt/trackLength;state.aiProgress[1]+=state.aiSpeed[1]*dt/trackLength;pose(ai[0],state.aiProgress[0],-3.5);pose(ai[1],state.aiProgress[1],3.5);ai.forEach((c,i)=>c.wheels.forEach(w=>w.rotation.x+=state.aiSpeed[i]*dt*1.8));
 const all=[{p:state.playerProgress,id:0},{p:state.aiProgress[0],id:1},{p:state.aiProgress[1],id:2}].sort((a,b)=>b.p-a.p),position=all.findIndex(x=>x.id===0)+1,currentLap=Math.min(3,Math.floor(state.playerProgress)+1);state.lap=currentLap;speedEl.innerHTML=Math.round(actualSpeed*3.6)+' <small>KM/H</small>';infoEl.innerHTML='VUELTA '+currentLap+' / 3<br>POSICIÓN '+position+' / 3';msg.textContent='';if(state.playerProgress>=3){state.running=false;msg.textContent=position===1?'¡HAS GANADO!':'¡CARRERA TERMINADA!';sub.textContent=position===1?'¡CAMPEÓN DE TURBO ISLAND!':'¡BUEN INTENTO!';startBtn.textContent='VOLVER A CORRER';startBtn.style.display='block'}else if(state.aiProgress.some(p=>p>=3)){state.running=false;msg.textContent='¡LOS RIVALES HAN GANADO!';sub.textContent='Inténtalo otra vez';startBtn.textContent='REINTENTAR';startBtn.style.display='block'}}
 const angle=player.group.rotation.y,forward=new THREE.Vector3(Math.sin(angle),0,Math.cos(angle)),target=player.group.position.clone().add(new THREE.Vector3(0,5.2,0)).addScaledVector(forward,-11.5);camera.position.lerp(target,.105);camera.lookAt(player.group.position.clone().add(new THREE.Vector3(0,1.25,0)).addScaledVector(forward,5));renderer.render(scene,camera)}
pose(player,0,0);pose(ai[0],.012,-3.5);pose(ai[1],.025,3.5);animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})})();
